<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#070b16"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="circuitGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08"/>
      <circle cx="40" cy="40" r="1" fill="#818cf8" fill-opacity="0.2"/>
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.45)); opacity: 0.95; }
        50% { filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.65)); opacity: 1; }
      }
      @keyframes circuitStream {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatChipA {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes floatChipB {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(3px); }
      }
      @keyframes radarPulse {
        0% { r: 6px; opacity: 0.8; }
        50% { r: 16px; opacity: 0.2; }
        100% { r: 6px; opacity: 0.8; }
      }
      .circuit-line {
        stroke-dasharray: 80 120;
        animation: circuitStream 12s linear infinite;
      }
      .chip-a {
        animation: floatChipA 6s ease-in-out infinite;
      }
      .chip-b {
        animation: floatChipB 7s ease-in-out infinite;
      }
      .header-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .header-sub {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect width="1000" height="320" rx="16" fill="url(#circuitGrid)"/>

  <!-- Subtle Outer Border with Glow -->
  <rect x="1" y="1" width="998" height="318" rx="15" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Background Decorative Geometric Circles & Nodes (Behind everything) -->
  <circle cx="120" cy="60" r="140" fill="url(#glowGrad)"/>
  <circle cx="880" cy="260" r="160" fill="url(#glowGrad)"/>

  <!-- Dynamic Animated Circuit Pathways (Subtle background paths) -->
  <g fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" class="circuit-line">
    <path d="M 0 100 L 180 100 L 230 150 L 320 150"/>
    <path d="M 1000 220 L 820 220 L 770 170 L 680 170"/>
    <path d="M 150 0 L 150 70 L 190 110"/>
    <path d="M 850 320 L 850 250 L 810 210"/>
  </g>

  <!-- Edge Connection Pulse Nodes -->
  <circle cx="230" cy="150" r="4" fill="#38bdf8" opacity="0.7"/>
  <circle cx="230" cy="150" r="10" fill="none" stroke="#38bdf8" opacity="0.4" style="animation: radarPulse 4s ease-out infinite;"/>
  <circle cx="770" cy="170" r="4" fill="#a855f7" opacity="0.7"/>
  <circle cx="770" cy="170" r="10" fill="none" stroke="#a855f7" opacity="0.4" style="animation: radarPulse 4.5s ease-out infinite;"/>

  <!-- Peripheral Technology Badges (Positioned near borders to avoid center text) -->
  <!-- Top Left Badge -->
  <g class="chip-a" transform="translate(45, 30)">
    <rect width="170" height="28" rx="14" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="14" cy="14" r="4" fill="#38bdf8"/>
    <text x="26" y="18" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" font-weight="600">⚡ Ollama &amp; llama.cpp</text>
  </g>

  <!-- Top Right Badge -->
  <g class="chip-b" transform="translate(775, 30)">
    <rect width="180" height="28" rx="14" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="14" cy="14" r="4" fill="#818cf8"/>
    <text x="26" y="18" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" font-weight="600">🌐 Distributed Exo Clusters</text>
  </g>

  <!-- Bottom Left Badge -->
  <g class="chip-b" transform="translate(45, 262)">
    <rect width="185" height="28" rx="14" fill="url(#pillGrad)" stroke="#34d399" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="14" cy="14" r="4" fill="#34d399"/>
    <text x="26" y="18" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" font-weight="600">🔒 100% Offline Privacy</text>
  </g>

  <!-- Bottom Right Badge -->
  <g class="chip-a" transform="translate(765, 262)">
    <rect width="190" height="28" rx="14" fill="url(#pillGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="14" cy="14" r="4" fill="#c084fc"/>
    <text x="26" y="18" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" font-weight="600">📦 GGUF • AWQ • EXL2 • TVM</text>
  </g>

  <!-- FOREGROUND HERO CONTENT (Guaranteed clean & unobstructed) -->
  <g transform="translate(500, 0)">
    <!-- Small Category Pill -->
    <g transform="translate(-130, 75)">
      <rect width="260" height="26" rx="13" fill="#1e1b4b" fill-opacity="0.7" stroke="#6366f1" stroke-width="1"/>
      <text x="130" y="17" fill="#a5b4fc" font-size="11" font-family="system-ui, sans-serif" font-weight="700" letter-spacing="1.5" text-anchor="middle">🚀 CURATED AI ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" text-anchor="middle" class="header-title" font-size="34" fill="url(#primaryGrad)" filter="url(#textGlow)">
      Awesome Local &amp; Edge Model Deployment
    </text>

    <!-- Subtitle -->
    <text x="0" y="185" text-anchor="middle" class="header-sub" font-size="16" fill="#f8fafc" font-weight="600" letter-spacing="0.2">
      On-Device Inference • Quantized Model Serving • Distributed Hardware Clusters
    </text>

    <!-- Secondary Tagline -->
    <text x="0" y="215" text-anchor="middle" class="header-sub" font-size="13" fill="#94a3b8">
      Compile, quantize, and serve LLMs on laptops, SBCs, and consumer GPUs with zero cloud latency
    </text>

    <!-- Decorative Bottom Accent Bar -->
    <rect x="-140" y="235" width="280" height="3" rx="1.5" fill="url(#primaryGrad)" opacity="0.8"/>
  </g>
</svg>
